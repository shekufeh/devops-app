stages:
  - test
  - build
  - push
  - update

variables:
  IMAGE_TAG: "$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""

test_html:
  stage: test
  script:
    - echo "Checking HTML application..."
    - test -s html/index.html
    - grep -qi "<html" html/index.html
    - echo "HTML validation passed!"

build_image:
  stage: build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker image inspect "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

push_image:
  stage: push
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker logout "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

update_gitops:
  stage: update
  script:
    - |
      AUTH=$(printf '%s' "${GITOPS_USER}:${GITOPS_TOKEN}" | base64 | tr -d '\n')

      git -c http.extraheader="Authorization: Basic ${AUTH}" \
        clone http://gitlab.home.arpa/devops-assignment/devops-app-gitops.git

      cd devops-app-gitops

      sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}|" base/deployment.yaml

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@example.local"

      git add base/deployment.yaml

      if ! git diff --cached --quiet; then
        git commit -m "Update image to ${IMAGE_TAG}"
        git -c http.extraheader="Authorization: Basic ${AUTH}" push origin main
      else
        echo "No GitOps changes detected."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
